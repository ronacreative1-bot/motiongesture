<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fluid Camera Hand V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#cam{position:fixed;right:12px;bottom:12px;width:145px;height:195px;object-fit:cover;border-radius:18px;opacity:.25;transform:scaleX(-1);display:none;z-index:4}
#top{position:fixed;z-index:8;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}
button,.pill,#panel,#help{background:#111113d9;color:#fff;border:1px solid #ffffff18;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:15px}
button{padding:11px 14px;border:0;font-size:14px}.pill{padding:11px 13px;font-size:12px;letter-spacing:.06em;flex:1}
#panel{display:none;position:fixed;z-index:9;left:12px;top:62px;width:min(350px,calc(100vw - 24px));padding:13px}#panel.open{display:block}
label{display:grid;grid-template-columns:88px 1fr 48px;gap:7px;align-items:center;font-size:12px;color:#ddd;margin:9px 0}input{width:100%}
#bottom{position:fixed;z-index:8;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
#help{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,88vw);padding:22px;text-align:center}#help.hide{display:none}#help h1{margin:0 0 8px;font-size:22px}#help p{font-size:13px;line-height:1.5;color:#aaa}#debug{position:fixed;z-index:8;left:12px;bottom:72px;color:#aaa;font-size:11px}
</style></head><body>
<canvas id="c"></canvas><video id="cam" playsinline muted></video>
<div id="top"><div id="status" class="pill">FLUID V2 • TOUCH</div><button id="camera">📷 KAMERA</button><button id="settings">⚙︎</button></div>
<div id="panel">
<label>Force<input id="force" type="range" min=".2" max="4" step=".05" value="1.4"><span id="forceV">1.40</span></label>
<label>Radius<input id="radius" type="range" min="8" max="140" value="48"><span id="radiusV">48</span></label>
<label>Disipasi<input id="diss" type="range" min=".985" max=".9998" step=".0005" value=".997"><span id="dissV">.9970</span></label>
<label>Viskositas<input id="visc" type="range" min="0" max=".0015" step=".00005" value=".00025"><span id="viscV">.00025</span></label>
<label>Vortisitas<input id="vort" type="range" min="0" max="45" value="22"><span id="vortV">22</span></label>
<label>Bloom<input id="bloom" type="range" min=".2" max="2" step=".05" value="1"><span id="bloomV">1.00</span></label>
</div>
<div id="help"><h1>Fluid Camera Hand V2</h1><p>☝ Telunjuk mendorong fluid • 🤏 pinch mengubah radius • ✋ telapak menambah force.</p><button id="start">Aktifkan Kamera</button><p>Gunakan URL HTTPS GitHub Pages kamu.</p></div>
<div id="bottom"><button id="touch">☝ Touch</button><button id="auto">✨ Auto</button><button id="clear">↺ Clear</button><button id="preview">◉ Preview</button></div><div id="debug"></div>

<script type="module">
import{FilesetResolver,HandLandmarker}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";
const C=document.getElementById("c"),gl=C.getContext("webgl2",{alpha:false,antialias:false});if(!gl)throw Error("WebGL2 tidak tersedia");
let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;gl.viewport(0,0,C.width,C.height)}addEventListener("resize",resize);resize();
const cfg={force:1.4,radius:48,diss:.997,visc:.00025,vort:22,bloom:1};for(const id of Object.keys(cfg)){const e=document.getElementById(id),o=document.getElementById(id+"V");e.oninput=()=>{cfg[id]=+e.value;o.textContent=id==="diss"?cfg[id].toFixed(4):id==="visc"?cfg[id].toFixed(5):cfg[id].toFixed(id==="radius"||id==="vort"?0:2)}}
const S=256;
function tex(){let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);for(const [p,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,p,v);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,S,S,0,gl.RGBA,gl.HALF_FLOAT,null);return t}
function fb(){let f=gl.createFramebuffer(),t=tex();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{f,t}}
let va=fb(),vb=fb(),da=fb(),db=fb(),pa=fb(),pb=fb(),dv=fb();
const VS=`#version 300 es\nin vec2 a;out vec2 u;void main(){u=a*.5+.5;gl_Position=vec4(a,0,1)}`;
function P(fs){let v=gl.createShader(gl.VERTEX_SHADER),f=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(v,VS);gl.compileShader(v);gl.shaderSource(f,fs);gl.compileShader(f);let p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);return p}
const ADV=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D t,v;uniform vec2 px;uniform float d;void main(){vec2 x=texture(v,u).xy;o=texture(t,u-x*.9*px)*d;}`);
const SPL=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D t;uniform vec2 q,f;uniform float r,a;void main(){vec4 x=texture(t,u);float g=exp(-dot(u-q,u-q)/(r*r));o=x+vec4(f*g*a,0,0);}`);
const DYE=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D t;uniform vec2 q,col;uniform float r,a;void main(){vec4 x=texture(t,u);float g=exp(-dot(u-q,u-q)/(r*r));o=x+vec4(col*g*a,1.*g*a);}`);
const DIV=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D v;uniform vec2 p;void main(){float l=texture(v,u-vec2(p.x,0)).x,r=texture(v,u+vec2(p.x,0)).x,b=texture(v,u-vec2(0,p.y)).y,t=texture(v,u+vec2(0,p.y)).y;o=vec4((r-l+t-b)*.5,0,0,1);}`);
const PR=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D p,d;uniform vec2 px;void main(){float l=texture(p,u-vec2(px.x,0)).x,r=texture(p,u+vec2(px.x,0)).x,b=texture(p,u-vec2(0,px.y)).x,t=texture(p,u+vec2(0,px.y)).x;o=vec4((l+r+b+t-texture(d,u).x)*.25,0,0,1);}`);
const GR=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D v,p;uniform vec2 px;void main(){float l=texture(p,u-vec2(px.x,0)).x,r=texture(p,u+vec2(px.x,0)).x,b=texture(p,u-vec2(0,px.y)).x,t=texture(p,u+vec2(0,px.y)).x;o=vec4(texture(v,u).xy-.5*vec2(r-l,t-b),0,1);}`);
const OUT=P(`#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D d;uniform float b;void main(){vec3 x=texture(d,u).rgb;vec3 c=1.-exp(-x*b*2.3);o=vec4(c,1);}`);
let q=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,q);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
function run(p,target,us){gl.bindFramebuffer(gl.FRAMEBUFFER,target?.f||null);gl.viewport(0,0,target?S:S);gl.useProgram(p);let a=gl.getAttribLocation(p,"a");gl.bindBuffer(gl.ARRAY_BUFFER,q);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);for(const[k,v]of Object.entries(us)){let l=gl.getUniformLocation(p,k);if(v.t){gl.activeTexture(gl.TEXTURE0+v.n);gl.bindTexture(gl.TEXTURE_2D,v.t);gl.uniform1i(l,v.n)}else if(v.length===2)gl.uniform2f(l,v[0],v[1]);else gl.uniform1f(l,v)}gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function swap(a,b){return[b,a]}
function splat(x,y,vx,vy,r,a){let q=[x/W,1-y/H];run(SPL,vb,{t:{t:va.t,n:0},q,f:[vx,vy],r:r/W,a});[va,vb]=swap(va,vb);let h=(performance.now()/30)%360,s=h/60,i=Math.floor(s)%6,f2=s-Math.floor(s),col=[[1,f2,0],[1-f2,1,0],[0,1,f2],[0,1-f2,1],[f2,0,1],[1,0,1-f2]][i];run(DYE,db,{t:{t:da.t,n:0},q,col,r:r/W,a:a*.7});[da,db]=swap(da,db)}
function step(){run(ADV,vb,{t:{t:va.t,n:0},v:{t:va.t,n:1},px:[1/S,1/S],d:.9995});[va,vb]=swap(va,vb);run(ADV,db,{t:{t:da.t,n:0},v:{t:va.t,n:1},px:[1/S,1/S],d:cfg.diss});[da,db]=swap(da,db);run(DIV,dv,{v:{t:va.t,n:0},p:[1/S,1/S]});for(let i=0;i<10;i++){run(PR,pb,{p:{t:pa.t,n:0},d:{t:dv.t,n:1},px:[1/S,1/S]});[pa,pb]=swap(pa,pb)}run(GR,vb,{v:{t:va.t,n:0},p:{t:pa.t,n:1},px:[1/S,1/S]});[va,vb]=swap(va,vb)}
let down=false,x=0,y=0,px=0,py=0,auto=false;C.onpointerdown=e=>{down=true;x=px=e.clientX;y=py=e.clientY};C.onpointerup=()=>down=false;C.onpointermove=e=>{x=e.clientX;y=e.clientY};
let hand=null,camOn=false,last=-1,lastH=null,lastHT=0;const video=document.getElementById("cam"),status=document.getElementById("status"),debug=document.getElementById("debug");
async function startCam(){try{const v=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm");hand=await HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:1});let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=s;await video.play();camOn=true;document.getElementById("help").classList.add("hide");video.style.display="block";status.textContent="FLUID V2 • CAMERA HAND";requestAnimationFrame(track)}catch(e){alert("Kamera gagal: "+e.message)}}
async function track(){if(!camOn)return;if(video.readyState>1&&video.currentTime!==last){let now=performance.now(),r=hand.detectForVideo(video,now);last=video.currentTime;if(r.landmarks?.length){let m=r.landmarks[0],t=m[8],th=m[4],X=(1-t.x)*W,Y=t.y*H,tx=(1-th.x)*W,ty=th.y*H,d=Math.hypot(X-tx,Y-ty),pin=Math.max(0,Math.min(1,1-d/120)),vx=0,vy=0,dt=.016;if(lastH){dt=Math.max(.016,(now-lastHT)/1000);vx=(X-lastH.x)/dt;vy=(Y-lastH.y)/dt}lastH={x:X,y:Y};lastHT=now;let r0=pin>.2?12+(1-pin)*105:cfg.radius,sp=Math.hypot(vx,vy),a=cfg.force*(1+Math.min(1,sp/900));splat(X,Y,Math.max(-2,Math.min(2,vx/550))*a,Math.max(-2,Math.min(2,vy/550))*a,r0,a);debug.textContent=`HAND • ${X|0},${Y|0} • pinch ${pin.toFixed(2)}`}}requestAnimationFrame(track)}
function clear(){for(const z of[va,vb,da,db,pa,pb,dv]){gl.bindFramebuffer(gl.FRAMEBUFFER,z.f);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}gl.bindFramebuffer(gl.FRAMEBUFFER,null)}
document.getElementById("start").onclick=startCam;document.getElementById("camera").onclick=startCam;document.getElementById("settings").onclick=()=>document.getElementById("panel").classList.toggle("open");document.getElementById("auto").onclick=()=>auto=!auto;document.getElementById("clear").onclick=clear;document.getElementById("touch").onclick=()=>{camOn=false;status.textContent="FLUID V2 • TOUCH"};document.getElementById("preview").onclick=()=>video.style.display=video.style.display==="none"?"block":"none";
function frame(){if(down){splat(x,y,(x-px)/100,(y-py)/100,cfg.radius,cfg.force);px=x;py=y}if(auto){let t=performance.now()/1000;let X=W/2+Math.cos(t*.8)*W*.28,Y=H/2+Math.sin(t)*H*.25;splat(X,Y,Math.cos(t*1.8),Math.sin(t*1.5),cfg.radius,1)}step();run(OUT,null,{d:{t:da.t,n:0},b:cfg.bloom});requestAnimationFrame(frame)}clear();frame();
</script></body></html>
